name: Build Aetheria Android APK

on:
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.4.1
    env:
      ANDROID_HOME: /usr/lib/android-sdk
      ANDROID_SDK_ROOT: /usr/lib/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java and Android command-line tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends openjdk-17-jdk-headless unzip wget blender python3-numpy
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/android-tools.zip
          mkdir -p /tmp/android-tools
          unzip -q /tmp/android-tools.zip -d /tmp/android-tools
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          cp -a /tmp/android-tools/cmdline-tools/. "$ANDROID_HOME/cmdline-tools/latest/"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;23.2.8568313"
          echo "Installed Android SDK packages:"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --list_installed
          test -x "$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/ndk/23.2.8568313"
          test -x "$ANDROID_HOME/cmake/3.10.2.4988404/bin/cmake"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Configure Godot Android SDK paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          EOF

      - name: Install Godot Android export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O /tmp/godot-templates.tpz
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

      - name: Configure Godot Android signing
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Prepare output
        run: mkdir -p build

      - name: Download high-detail Sombrio model (CC0)
        run: |
          export PYTHONPATH=/usr/lib/python3/dist-packages:$PYTHONPATH
          mkdir -p assets/realistic/characters assets/realistic/weapons assets/realistic/architecture assets/realistic/nature
          wget -q --show-progress https://grab3d.com/dl/horror-monster/horror-monster-light.glb -O assets/realistic/characters/horror_monster_light.glb
          test -s assets/realistic/characters/horror_monster_light.glb
          test "$(wc -c < assets/realistic/characters/horror_monster_light.glb)" -gt 1000000
          head -c 4 assets/realistic/characters/horror_monster_light.glb | grep -q glTF
          blender --background --python tools/rig_sombrio.py -- assets/realistic/characters/horror_monster_light.glb assets/realistic/characters/horror_monster_rigged.glb
          test -s assets/realistic/characters/horror_monster_rigged.glb
          wget -q --show-progress https://grab3d.com/dl/man-base-character-rigged/man-base-character-rigged.glb -O assets/realistic/characters/man-base-character-rigged.glb
          test -s assets/realistic/characters/man-base-character-rigged.glb
          blender --background --python tools/prepare_hero.py -- assets/realistic/characters/man-base-character-rigged.glb assets/realistic/characters/hero_animated.glb || cp assets/realistic/characters/man-base-character-rigged.glb assets/realistic/characters/hero_animated.glb
          test -s assets/realistic/characters/hero_animated.glb
          wget -q --show-progress https://grab3d.com/dl/fantasy-sword/fantasy-sword-light.glb -O assets/realistic/weapons/fantasy-sword-light.glb
          test -s assets/realistic/weapons/fantasy-sword-light.glb
          wget -q --show-progress https://files.innerscene.com/library/arch-bridge-stone-719c9452/2db4fb9cae8f0ff2672d/arch-bridge-stone.glb -O assets/realistic/architecture/arch_bridge_stone.glb
          test -s assets/realistic/architecture/arch_bridge_stone.glb
          wget -q --show-progress https://grab3d.com/dl/roman-ruins/roman-ruins.glb -O assets/realistic/architecture/roman_ruins.glb
          test -s assets/realistic/architecture/roman_ruins.glb
          wget -q --show-progress https://grab3d.com/dl/ruin-archway/ruin-archway.glb -O assets/realistic/architecture/ruin_archway.glb
          test -s assets/realistic/architecture/ruin_archway.glb
          wget -q --show-progress https://grab3d.com/dl/broken-column-stump/broken-column-stump.glb -O assets/realistic/architecture/broken_column_stump.glb
          test -s assets/realistic/architecture/broken_column_stump.glb
          wget -q --show-progress https://grab3d.com/dl/ruin-wall-corner/ruin-wall-corner.glb -O assets/realistic/architecture/ruin_wall_corner.glb
          test -s assets/realistic/architecture/ruin_wall_corner.glb
          wget -q --show-progress https://grab3d.com/dl/ruin-wall-segment/ruin-wall-segment.glb -O assets/realistic/architecture/ruin_wall_segment.glb
          test -s assets/realistic/architecture/ruin_wall_segment.glb

      - name: Validate project
        run: godot --headless --editor --path . --quit

      - name: Export Android debug APK
        run: |
          godot --headless --verbose --path . --export-debug "Android" build/Aetheria-debug.apk

      - name: Verify APK
        run: test -s build/Aetheria-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aetheria-Android-debug
          path: build/Aetheria-debug.apk
          if-no-files-found: error
          retention-days: 14
